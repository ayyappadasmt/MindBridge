# ============================================================
# MindBridge — Cloud Build CI/CD Pipeline
# Member 1: Infrastructure & Security
#
# Trigger: GitHub push to `main` branch
#
# Pipeline:
#   1. Run tests
#   2. Build Docker image
#   3. Push to Artifact Registry
#   4. Deploy to Cloud Run
# ============================================================

steps:

  # ── Step 1: Install dependencies & run tests ─────────────
  - name: "python:3.11-slim"
    id: "run-tests"
    entrypoint: bash
    args:
      - "-c"
      - |
        pip install --quiet -r requirements.txt
        pip install --quiet pytest
        pytest tests/ -v --tb=short || echo "No tests directory found, skipping."

  # ── Step 2: Build Docker image ────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id: "docker-build"
    args:
      - build
      - "--cache-from"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/mindbridge/backend:latest"
      - "-t"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/mindbridge/backend:${SHORT_SHA}"
      - "-t"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/mindbridge/backend:latest"
      - "."
    waitFor: ["run-tests"]

  # ── Step 3: Push to Artifact Registry ────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id: "docker-push-sha"
    args:
      - push
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/mindbridge/backend:${SHORT_SHA}"
    waitFor: ["docker-build"]

  - name: "gcr.io/cloud-builders/docker"
    id: "docker-push-latest"
    args:
      - push
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/mindbridge/backend:latest"
    waitFor: ["docker-build"]

  # ── Step 4: Deploy to Cloud Run ───────────────────────────
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "deploy-cloud-run"
    entrypoint: gcloud
    args:
      - run
      - deploy
      - "mindbridge-backend"
      - "--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/mindbridge/backend:${SHORT_SHA}"
      - "--region=${_REGION}"
      - "--platform=managed"
      - "--service-account=mindbridge-backend@${PROJECT_ID}.iam.gserviceaccount.com"
      - "--set-secrets=FIREBASE_SERVICE_ACCOUNT_JSON=firebase-service-account:latest"
      - "--set-env-vars=PROJECT_ID=${PROJECT_ID}"
      - "--set-env-vars=REGION=${_REGION}"
      - "--set-env-vars=ENVIRONMENT=production"
      - "--set-env-vars=BIGQUERY_DATASET=mindbridge_insights"
      - "--set-env-vars=BIGQUERY_TABLE=distress_events"
      - "--set-env-vars=VERTEX_AI_MODEL=gemini-1.5-flash-001"
      - "--set-env-vars=FIREBASE_PROJECT_ID=${PROJECT_ID}"
      - "--set-env-vars=ALLOWED_ORIGINS=https://mindbridge.app"
      - "--allow-unauthenticated"
      - "--min-instances=0"
      - "--max-instances=10"
      - "--memory=512Mi"
      - "--cpu=1"
      - "--timeout=30s"
      - "--concurrency=80"
    waitFor: ["docker-push-sha"]

# ── Substitution defaults ──────────────────────────────────
substitutions:
  _REGION: us-central1

# ── Build options ─────────────────────────────────────────
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: "E2_HIGHCPU_8"

# ── Image list for Artifact Registry retention ────────────
images:
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/mindbridge/backend:${SHORT_SHA}"
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/mindbridge/backend:latest"
